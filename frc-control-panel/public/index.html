<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FRC7 Control · Neuriy AI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; font-family:"DM Sans",sans-serif; color:#101820;
      background:linear-gradient(160deg,#d5e8dc,#eef4f0 50%,#f2ebe4); }
    main { width:min(1000px,calc(100% - 2rem)); margin:1.5rem auto 2rem; }
    h1 { font-family:Syne,sans-serif; }
    .grid { display:grid; gap:.85rem; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    img { width:100%; border-radius:.45rem; border:1px solid rgba(16,24,32,.12); }
    a { color:#0b6e4f; font-weight:600; }
    p { color:#3d5348; }
  </style>
</head>
<body>
  <main>
    <h1>FRC7 · Neuriy photos</h1>
    <p>Updated FRC7.2 gallery. Full app UI lives in <code>apps/control-panel</code>.</p>
    <p><a href="https://github.com/EricksonAtHome/FRC7">GitHub</a> · <a href="../apps/control-panel/public/index.html">Local control panel</a></p>
    <div class="grid">
      <img src="img/frc7-control-panel.png" alt="Control panel" />
      <img src="img/frc7-neuriy-chat.png" alt="Neuriy chat" />
      <img src="img/frc7-neuriy-code.png" alt="Neuriy code" />
      <img src="img/frc7-neuriy-models.png" alt="Models" />
    </div>
  </main>
</body>
</html>
