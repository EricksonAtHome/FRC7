apiVersion: apps/v1
kind: Deployment
metadata:
  name: frc-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frc-gateway
  template:
    metadata:
      labels:
        app: frc-gateway
    spec:
      containers:
        - name: gateway
          image: frc/gateway:latest
          ports:
            - containerPort: 3000
