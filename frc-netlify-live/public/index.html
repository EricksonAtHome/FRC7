<!DOCTYPE html>
<html>
<head>
  <title>FRC Live Control System</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #ffffff;
      display: flex;
      height: 100vh;
    }

    .left {
      width: 40%;
      padding: 30px;
      border-right: 1px solid #eee;
    }

    .right {
      width: 60%;
      padding: 30px;
      background: #f9f9f9;
    }

    textarea {
      width: 100%;
      height: 300px;
      font-size: 14px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      cursor: pointer;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 15px;
      height: 400px;
      overflow: auto;
    }
  </style>
</head>

<body>

<div class="left">
  <h2>FRC Live System</h2>

  <textarea id="code">
use model models5
input "hello frc network"
  </textarea>

  <button onclick="run()">RUN</button>
</div>

<div class="right">
  <h3>OUTPUT</h3>
  <pre id="out">waiting...</pre>
</div>

<script>
async function run() {
  const code = document.getElementById("code").value;

  const res = await fetch("/.netlify/functions/route", {
    method: "POST",
    body: JSON.stringify({ code })
  });

  const data = await res.json();

  document.getElementById("out").innerText =
    JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
