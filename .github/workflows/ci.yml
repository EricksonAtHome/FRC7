name: CI
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test
        env:
          AYITI_HTTP_TIMEOUT_MS: "30000"
          FRC_DEFAULT_REGION: ht
