<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FRC7 · Ayiti OS + Neuriy AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #101820; --muted: #3d5348; --paper: #e7f0ea;
      --accent: #0b6e4f; --accent-2: #c45c26; --line: rgba(16,24,32,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(11,110,79,.28), transparent 60%),
        radial-gradient(700px 400px at 92% 0%, rgba(196,92,38,.16), transparent 55%),
        linear-gradient(160deg, #d5e8dc, #eef4f0 50%, #f2ebe4);
      min-height: 100vh;
    }
    header, main { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.5rem 0; }
    .brand { font-family: Syne, sans-serif; font-weight: 800; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.04em; }
    .tag { color: var(--muted); margin: 0; }
    .hero { padding: 1rem 0 2rem; }
    h1 { font-family: Syne, sans-serif; font-size: clamp(1.6rem, 3.5vw, 2.4rem); max-width: 18ch; margin: 0 0 .75rem; }
    .lede { color: var(--muted); max-width: 48ch; line-height: 1.5; }
    .cta { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.25rem; }
    a.btn {
      text-decoration: none; border-radius: .4rem; padding: .75rem 1.1rem; font-weight: 600;
      background: var(--accent); color: #f3fff8;
    }
    a.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .grid {
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      margin: 1.5rem 0 3rem;
    }
    figure {
      margin: 0; background: rgba(255,255,255,.72); border: 1px solid var(--line);
      border-radius: .5rem; overflow: hidden; backdrop-filter: blur(8px);
    }
    figure img, figure video { display: block; width: 100%; height: auto; }
    figcaption { padding: .7rem .85rem; font-size: .9rem; color: var(--muted); }
    .wide { grid-column: 1 / -1; }
    footer { padding: 0 0 2.5rem; color: var(--muted); font-size: .9rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">FRC7</div>
    <p class="tag">Ayiti OS · GoV · Neuriy AI</p>
  </header>
  <main>
    <section class="hero">
      <h1>Neuriy AI + Ayiti OS in one gateway</h1>
      <p class="lede">
        ChatGPT-style conversation models, government APIs for Haiti, FRCL scripts,
        and a control panel — screenshots from the live FRC7.2 demo.
      </p>
      <div class="cta">
        <a class="btn" href="https://github.com/EricksonAtHome/FRC7">GitHub repo</a>
        <a class="btn ghost" href="./chatgpt-systems.md">GPT systems guide</a>
        <a class="btn ghost" href="https://github.com/EricksonAtHome/FRC7/blob/main/NEURIY_AI.md">Neuriy docs</a>
      </div>
    </section>

    <section class="grid">
      <figure class="wide">
        <img src="./assets/frc7-control-panel.png" alt="FRC7 control panel home" />
        <figcaption>Control panel — Neuriy + Ayiti model shortcuts</figcaption>
      </figure>
      <figure>
        <img src="./assets/frc7-neuriy-chat.png" alt="Neuriy chat explaining LLMs" />
        <figcaption>neuriy.chat — conversational reply</figcaption>
      </figure>
      <figure>
        <img src="./assets/frc7-neuriy-code.png" alt="Neuriy code model response" />
        <figcaption>neuriy.code — pair-programming sketch</figcaption>
      </figure>
      <figure>
        <img src="./assets/frc7-neuriy-models.png" alt="Models JSON listing Neuriy and Ayiti" />
        <figcaption>/v1/models — Neuriy AI + Ayiti OS catalog</figcaption>
      </figure>
      <figure class="wide">
        <video controls playsinline poster="./assets/frc7-neuriy-home.png" src="./assets/frc7-neuriy-screencast-lite.mp4">
          Demo video not supported in this browser.
        </video>
        <figcaption>UI walkthrough screencast</figcaption>
      </figure>
    </section>

    <footer>
      FRC7.2 · MIT ·
      <a href="https://github.com/EricksonAtHome/FRC7">EricksonAtHome/FRC7</a>
    </footer>
  </main>
</body>
</html>
