<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRC Global Control Panel</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --panel-bg: #f8f9fa;
      --border: #e9ecef;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      height: 100vh;
    }

    .left {
      width: 40%;
      padding: 40px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .right {
      width: 60%;
      padding: 40px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
    }

    h2, h3 {
      margin-top: 0;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    textarea {
      width: 100%;
      flex-grow: 1;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      resize: none;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      margin-bottom: 20px;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 8px;
      flex-grow: 1;
      overflow-y: auto;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      margin: 0;
    }
  </style>
</head>

<body>

<div class="left">
  <h2>FRC Request Panel</h2>

  <textarea id="code">
use model models5
network frc.systems { mode "auto" }
run model models5 { input "detect system topology" }
  </textarea>

  <button onclick="send()">Deploy Request 🚀</button>
</div>

<div class="right">
  <h3>Server Execution Output</h3>
  <pre id="output">Waiting for deployment...</pre>
</div>

<script>
async function send() {
  const code = document.getElementById("code").value;
  const output = document.getElementById("output");
  
  output.innerText = "Routing request through global Netlify Gateway...\nDetecting region...";

  try {
    const res = await fetch("/.netlify/functions/route", {
      method: "POST",
      body: JSON.stringify({ code })
    });

    const data = await res.json();
    output.innerText = JSON.stringify(data, null, 2);
  } catch (err) {
    output.innerText = `Error connecting to gateway:\n${err.message}`;
  }
}
</script>

</body>
</html>
